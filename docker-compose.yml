services:
  api:
    image: ghcr.io/juliabrpereira/task-project:${IMAGE_TAG:-latest}
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_ENV:-Production}
      - Logging__LogLevel__Default=${LOG_LEVEL:-Information}
      - HealthChecks__MemoryLimitMB=${HEALTH_MEMORY_LIMIT_MB:-512}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
